<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Batería sin foto">
  <!-- Marcador de posición mientras el producto no tenga foto cargada desde el panel.
       Dibujo plano, en los grises del sistema: tiene que leerse como "falta la foto",
       no competir con las fotos reales de al lado. -->
  <rect width="400" height="320" fill="#F0F0F0"/>
  <!-- Cuerpo -->
  <rect x="96" y="104" width="208" height="150" rx="8" fill="#D9D9D9"/>
  <!-- Tapa -->
  <rect x="96" y="88" width="208" height="26" rx="6" fill="#BFBFBF"/>
  <!-- Bornes -->
  <rect x="126" y="70" width="30" height="22" rx="4" fill="#8A8A8A"/>
  <rect x="244" y="70" width="30" height="22" rx="4" fill="#8A8A8A"/>
  <!-- Etiqueta -->
  <rect x="124" y="140" width="152" height="60" rx="6" fill="#FFFFFF"/>
  <rect x="140" y="158" width="60" height="10" rx="5" fill="#D9D9D9"/>
  <rect x="140" y="176" width="96" height="8" rx="4" fill="#E8E8E8"/>
  <!-- Signos de polaridad -->
  <path d="M132 214h18M141 205v18" stroke="#8A8A8A" stroke-width="4" stroke-linecap="round"/>
  <path d="M250 214h18" stroke="#8A8A8A" stroke-width="4" stroke-linecap="round"/>
</svg>
